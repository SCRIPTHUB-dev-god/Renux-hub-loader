<!DOCTYPE html>
<html lang="id">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}

</style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renux Hub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-style: normal !important;
    }
    body {
      min-height: 100vh;
      background: #0a0a0a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      overflow-x: hidden;
      position: relative;
    }
    .background {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background-color: #0a0a0a;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    .blur {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
    }
    .blur-1 {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255,255,255,0.13) 0%, transparent 70%);
      top: -150px;
      left: -150px;
    }
    .blur-2 {
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(255,255,255,0.09) 0%, transparent 70%);
      bottom: -200px;
      right: -150px;
    }
    .blur-3 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 72px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10,10,10,0.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: white;
      color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 0 20px rgba(255,255,255,0.25);
    }
    .logo-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .logo-text span {
      color: rgba(255,255,255,0.45);
      font-weight: 500;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.10);
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    main {
      position: relative;
      z-index: 1;
      min-height: calc(100vh - 72px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }
    .card {
      position: relative;
      width: 100%;
      max-width: 440px;
      background: rgba(26,26,26,0.85);
      border-radius: 20px;
      padding: 32px;
      overflow: hidden;
      z-index: 1;
      isolation: isolate;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 22px;
      background: conic-gradient(from var(--angle), #0a0a0a, #ffffff, #d0d0d0, #ffffff, #0a0a0a, #ffffff, #0a0a0a);
      animation: spin 4s linear infinite;
      z-index: -2;
    }
    .card::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 19px;
      background: rgba(18,18,18,0.96);
      z-index: -1;
    }
    .card-glow {
      position: absolute;
      inset: -2px;
      border-radius: 22px;
      background: conic-gradient(from var(--angle), #0a0a0a, #ffffff, #d0d0d0, #ffffff, #0a0a0a);
      animation: spin 4s linear infinite;
      filter: blur(14px);
      opacity: 0.32;
      z-index: -3;
    }
    @property --angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }
    @keyframes spin {
      to { --angle: 360deg; }
    }
    .label {
      position: relative;
      z-index: 2;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 20px;
    }
    .paragraph {
      position: relative;
      z-index: 2;
      font-size: 15px;
      line-height: 1.75;
      color: rgba(255,255,255,0.78);
      letter-spacing: -0.01em;
    }
    .paragraph strong {
      color: white;
      font-weight: 600;
    }
    .link-btn {
      position: relative;
      z-index: 2;
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      background: white;
      color: black;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    .link-btn:hover {
      background: #f0f0f0;
    }
    .link-btn.pop {
      animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes pop {
      0% { transform: scale(1); }
      35% { transform: scale(1.06); }
      70% { transform: scale(0.97); }
      100% { transform: scale(1); }
    }
    .arrow {
      transition: transform 0.2s ease;
    }
    .link-btn:hover .arrow {
      transform: translateX(3px);
    }
  </style>
</head>
<body>
  <div class="background">
    <div class="blur blur-1"></div>
    <div class="blur blur-2"></div>
    <div class="blur blur-3"></div>
  </div>
  <header>
    <div class="logo-wrap">
      <div class="logo-icon">D</div>
      <div class="logo-text">Dash<span>board</span></div>
    </div>
    <div class="header-right">
      <div class="pill"><div class="dot"></div> Live </div>
    </div>
  </header>
  <main>
    <div class="card">
      <div class="card-glow"></div>
      <div class="label">Renux Hub</div>
      <p class="paragraph">
        <strong>Renux Hub</strong> It is the best keyless script hub, featuring a great UI and regular updates, with support for 6+ popular games and an extremely stable loader system.
      </p>
      <p class="paragraph" style="margin-top: 16px; font-size: 14px; color: rgba(255,255,255,0.55);">
        Click the button below to get the script.
      </p>
      <a id="linkBtn" class="link-btn" href="https://renuxhub-loader.vercel.app/script.html" target="_blank">
        open to website <span class="arrow">→</span>
      </a>
    </div>
  </main>
  <script>
    const linkBtn = document.getElementById('linkBtn');
    linkBtn.addEventListener('click', () => {
      linkBtn.classList.remove('pop');
      void linkBtn.offsetWidth;
      linkBtn.classList.add('pop');
      setTimeout(() => {
        linkBtn.classList.remove('pop');
      }, 500);
    });
  </script>
